<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Harian · Workshop Day 1</title>
  <meta name="description" content="Kumpulan kalkulator matematika, keuangan, kesehatan, dan konversi satuan dalam Bahasa Indonesia. Cepat, responsif, dan bisa dipakai offline.">
  <meta name="theme-color" content="#146b58">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23146b58'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23fff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('calc-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Lompat ke konten utama</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Kalkulator Harian, beranda">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span class="brand-text">Kalkulator<span class="brand-dot">.</span></span>
      </a>

      <label class="search" for="search">
        <span class="visually-hidden">Cari kalkulator</span>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16.5 16.5 4 4"></path>
        </svg>
        <input id="search" type="search" placeholder="Cari kalkulator..." autocomplete="off">
        <span class="search-key" aria-hidden="true">/</span>
      </label>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Aktifkan tema gelap" aria-pressed="false">
        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
        </svg>
        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <span class="theme-label">Gelap</span>
      </button>
    </div>
  </header>

  <main id="main" class="container"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Kalkulator Harian · <span id="year"></span></p>
      <p>Dibuat untuk Workshop Day 1. Semua perhitungan berjalan di browser.</p>
    </div>
  </footer>

  <noscript>
    <div class="noscript">Aktifkan JavaScript untuk memakai kalkulator ini.</div>
  </noscript>

  <script src="assets/js/core/registry.js"></script>
  <script src="assets/js/core/format.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/calculators/scientific.js"></script>
  <script src="assets/js/calculators/percentage.js"></script>
  <script src="assets/js/calculators/fraction.js"></script>
  <script src="assets/js/calculators/statistics.js"></script>
  <script src="assets/js/calculators/loan.js"></script>
  <script src="assets/js/calculators/compound.js"></script>
  <script src="assets/js/calculators/tip.js"></script>
  <script src="assets/js/calculators/discount.js"></script>
  <script src="assets/js/calculators/bmi.js"></script>
  <script src="assets/js/calculators/calorie.js"></script>
  <script src="assets/js/calculators/unitconverter.js"></script>
  <script src="assets/js/calculators/age.js"></script>
  <script src="assets/js/calculators/gpa.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
